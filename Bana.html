<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>바나 콕콕!</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: 'Malgun Gothic', sans-serif;
        overflow: hidden;

        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }

      body {
        background: url('https://example.com/bg.jpg') center/cover no-repeat
          fixed;
      }

      .overlay {
        width: 100%;
        height: 100%;
        position: relative;
        background: rgba(0, 0, 0, 0.15);
        overflow: hidden;
      }

      /* ===== 터치시 효과 ===== */
      .ripple {
        position: absolute;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.4),
          transparent 70%
        );
        transform: translate(-50%, -50%) scale(0);
        animation: ripple 0.6s ease-out forwards;
      }

      @keyframes ripple {
        to {
          transform: translate(-50%, -50%) scale(8);
          opacity: 0;
        }
      }

      /* ===== 캐릭터 ===== */
      .character-wrapper {
        position: absolute;
        bottom: 70px;
        left: 50%;
        transform: translateX(-50%);
        width: 88%;
        max-width: 600px;
        pointer-events: none;
      }

      .character {
        width: 100%;
        transition: transform 0.15s ease;
      }

      .character.bounce {
        transform: scale(1.02);
      }

      /* ===== 모바일 화면 ===== */
      @media (max-width: 768px) {
        .character-wrapper {
          bottom: 120px;
          width: 100%;
        }

        .dialogue-box {
          width: 95%;
          padding: 16px 28px;
          font-size: 18px;
        }

        .text {
          font-size: 19px;
          line-height: 1.8;
        }

        .name {
          font-size: 16px;
          padding: 8px 16px;
        }
      }

      /* ===== 터치 영역 ===== */
      /* ===== 나나곰 바게트에 맞춰 설정되어 있습니다. ===== */
      /* ===== 🍎다른 스탠딩을 사용하시면 비율 수정이 필요합니다! ===== */
      .hit {
        position: absolute;
        pointer-events: auto;
        outline: none;
        -webkit-tap-highlight-color: transparent;
        opacity: 0.3;
      }

      .head {
        top: 10%;
        left: 30%;
        width: 40%;
        height: 25%;
        z-index: 1;
      }
      .eyes {
        top: 27%;
        left: 30%;
        width: 40%;
        height: 5%;
        z-index: 2;
      }
      .chest {
        top: 37%;
        left: 39%;
        width: 22%;
        height: 18%;
        z-index: 6;
      }
      .hand {
        top: 56%;
        left: 18%;
        width: 10%;
        height: 6%;
        z-index: 6;
      }
      .hand2 {
        top: 56%;
        right: 18%;
        width: 10%;
        height: 6%;
        z-index: 6;
      }
      .torso {
        top: 55%;
        left: 38%;
        width: 24%;
        height: 30%;
        z-index: 2;
      }
      .body {
        top: 35%;
        left: 30%;
        width: 40%;
        height: 45%;
        z-index: 1;
      }
      .leg {
        top: 85%;
        left: 30%;
        width: 40%;
        height: 9%;
        z-index: 2;
      }

      /* ===== 대화창 ===== */
      .dialogue-wrapper {
        position: absolute;
        bottom: 20px;
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .dialogue-box {
        width: 85%;
        max-width: 900px;
        background: linear-gradient(
          180deg,
          rgba(40, 40, 60, 0.95),
          rgba(20, 20, 30, 0.95)
        );
        border-radius: 16px;
        padding: 20px 28px;
        color: #fff;
      }

      /* ===== 🍎이름 배경 색을 설정하려면 이 부분을 수정해주세요! ===== */
      .name {
        background: #d8ae5c;
        color: #333;
        padding: 6px 14px;
        border-radius: 12px;
        font-weight: bold;
        display: inline-block;
        margin-bottom: 10px;
      }

      .text {
        font-size: 17px;
        line-height: 1.7;
        min-height: 60px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="overlay" id="overlay">
      <div class="character-wrapper">
        <img
          src="https://i.ibb.co/F4bxFnsZ/image.png"
          id="character"
          class="character"
        />

        <div class="hit head" data-part="head"></div>
        <div class="hit eyes" data-part="eyes"></div>
        <div class="hit chest" data-part="chest"></div>
        <div class="hit hand" data-part="hand"></div>
        <div class="hit hand2" data-part="hand2"></div>
        <div class="hit torso" data-part="torso"></div>
        <div class="hit body" data-part="body"></div>
        <div class="hit leg" data-part="leg"></div>
      </div>

      <div class="dialogue-wrapper">
        <div class="dialogue-box">
          <div class="name">🍎이름</div>
          <div class="text" id="dialogue"></div>
        </div>
      </div>
    </div>

    <script>
      const characterImg = document.getElementById('character');
      const dialogueBox = document.getElementById('dialogue');
      const overlay = document.getElementById('overlay');

      let typingInterval = null;

      const data = {
        head: {
          img: 'https://i.ibb.co/0pnytRDV/image.png',
          lines: ['🍎머리 터치'],
        },
        eyes: {
          img: 'https://i.ibb.co/yc0fmRBQ/image.png',
          lines: ['🍎눈 터치'],
        },
        chest: {
          img: 'https://i.ibb.co/bM2T56Yh/image.png',
          lines: ['🍎상체 터치'],
        },
        hand: {
          img: 'https://i.ibb.co/202Zb713/image.png',
          lines: ['🍎왼손 터치'],
        },
        hand2: {
          img: 'https://i.ibb.co/202Zb713/image.png',
          lines: ['🍎오른손 터치'],
        },
        torso: {
          img: 'https://i.ibb.co/7dzJPwPL/image.png',
          lines: ['🍎다리 터치'],
        },
        body: {
          img: 'https://i.ibb.co/F4bxFnsZ/image.png',
          lines: ['🍎몸 터치'],
        },
        leg: {
          img: 'https://i.ibb.co/4gY4mLdD/image.png',
          lines: ['🍎신발 터치'],
        },
      };

      function typeText(text) {
        if (typingInterval) clearInterval(typingInterval);
        dialogueBox.textContent = '';
        let i = 0;

        typingInterval = setInterval(() => {
          if (i >= text.length) {
            clearInterval(typingInterval);
            typingInterval = null;
            return;
          }
          dialogueBox.textContent += text[i++];
        }, 35);
      }

      function ripple(x, y) {
        const r = document.createElement('div');
        r.className = 'ripple';
        r.style.left = x + 'px';
        r.style.top = y + 'px';
        overlay.appendChild(r);
        setTimeout(() => r.remove(), 600);
      }

      document.querySelectorAll('.hit').forEach((el) => {
        el.addEventListener('pointerdown', (e) => {
          e.preventDefault();

          const part = el.dataset.part;
          ripple(e.clientX, e.clientY);

          characterImg.classList.add('bounce');
          setTimeout(() => characterImg.classList.remove('bounce'), 150);

          const info = data[part];
          if (!info) return;

          characterImg.src = info.img;
          typeText(info.lines[Math.floor(Math.random() * info.lines.length)]);
        });
      });

      typeText('🍎최초 진입시 기본 대사');
    </script>
  </body>
</html>
